plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4' apply false
    id 'io.spring.dependency-management' version '1.1.6' apply false
}

allprojects {
    group = 'com.github.ku4marez'
    version = '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
        maven {
            url = uri("https://maven.pkg.github.com/ku4marez/common-libraries")
            credentials {
                username = findProperty("gpr.user") ?: System.getenv("GPR_USER")
                password = findProperty("gpr.token") ?: System.getenv("GPR_TOKEN")
            }
        }
    }
}

subprojects {
    afterEvaluate {
        if (plugins.hasPlugin('java') || plugins.hasPlugin('java-library')) {
            configurations {
                annotationProcessor {
                    extendsFrom configurations.implementation
                }
                testAnnotationProcessor {
                    extendsFrom configurations.testImplementation
                }
            }

            dependencies {
                annotationProcessor platform(project(":platform"))
                testAnnotationProcessor platform(project(":platform"))

                annotationProcessor "org.projectlombok:lombok"
                annotationProcessor "org.mapstruct:mapstruct-processor"
                annotationProcessor "org.projectlombok:lombok-mapstruct-binding"

                testAnnotationProcessor "org.projectlombok:lombok"
                testAnnotationProcessor "org.mapstruct:mapstruct-processor"
                testAnnotationProcessor "org.projectlombok:lombok-mapstruct-binding"

                compileOnly "jakarta.persistence:jakarta.persistence-api:3.1.0"
                compileOnly "jakarta.annotation:jakarta.annotation-api"
            }
        }
    }
}

def javaServiceModules = subprojects.findAll { it.path.startsWith(':services:') }

configure(javaServiceModules) {
    apply plugin: 'java'
    java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
    test { useJUnitPlatform() }

    dependencies {
        // import the internal BOM
        implementation(platform(project(":platform")))
        implementation project(':starters:ecom-security-starter')
        implementation project(':starters:ecom-kafka-starter')
        implementation project(':starters:ecom-mongo-starter')
        implementation project(':starters:ecom-web-starter')
        // shared lib (remove if not all services use it)
        implementation("com.github.ku4marez:common-libraries:1.3.4") {
            exclude group: "org.springframework.boot", module: "spring-boot-starter-data-jpa"
            exclude group: "org.springframework.boot", module: "spring-boot-starter-jdbc"
            exclude group: "org.springframework.boot", module: "spring-boot-starter-data-mongodb"
            exclude group: "ch.qos.logback", module: "logback-classic"
        }
    }
}
