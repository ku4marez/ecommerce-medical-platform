rootProject.name = "ecommerce-medical-platform"
//enableFeaturePreview("TYPESAFE_PROJECT_ACCESSORS")

def includeIfExists(String path) {
    if (file(path).isDirectory()) {
        include(path.replace("/", ":"))
    } else {
        println "Skipping missing module: $path"
    }
}

// Shared platform
includeIfExists("platform")

// Starters
includeIfExists("starters")
includeIfExists("starters/ecom-security-starter")
includeIfExists("starters/ecom-kafka-starter")
includeIfExists("starters/ecom-web-starter")
includeIfExists("starters/ecom-mongo-starter")
includeIfExists("starters/ecom-redis-starter")
includeIfExists("starters/ecom-resilience-starter")

// Services
includeIfExists("services/catalog-service")
includeIfExists("services/order-service")
includeIfExists("services/payment-service")
includeIfExists("services/inventory-service")
includeIfExists("services/gateway-service")

// Clients
includeIfExists("clients/admin-client")
includeIfExists("clients/customer-client")
