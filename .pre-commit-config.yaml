repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-merge-conflict

  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
#      - id: check-merged-branch
      - id: forbid-binary

  # Optional: Prettier for JS/TS/JSON/YAML/Markdown (covers React, too)
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        additional_dependencies: ["prettier@3.3.3"]
        files: "\\.(js|jsx|ts|tsx|json|yml|yaml|md)$"

  # Optional: run Spotless via Gradle (if you add the Spotless plugin)
  # - repo: local
  #   hooks:
  #     - id: spotless-apply
  #       name: spotless apply
  #       entry: ./gradlew spotlessApply
  #       language: system
  #       files: "\\.(java|gradle|md)$"
