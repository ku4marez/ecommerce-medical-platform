name: Build

on:
  push:
    branches: [ main ]

jobs:
  build-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up GitHub Packages credentials
        run: |
          echo "GPR_USER=${{ secrets.GPR_USER  }}" >> $GITHUB_ENV
          echo "GPR_TOKEN=${{ secrets.GPR_TOKEN }}" >> $GITHUB_ENV

      - name: Build everything
        run: ./gradlew --no-daemon --stacktrace clean build -x test
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}

      # Upload service jars (adjust names if your modules differ)
      - name: Upload catalog-service JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-service-jar
          path: services/catalog-service/build/libs/*.jar

      - name: Upload inventory-service JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-service-jar
          path: services/inventory-service/build/libs/*.jar

      - name: Upload order-service JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order-service-jar
          path: services/order-service/build/libs/*.jar

      - name: Upload payment-service JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payment-service-jar
          path: services/payment-service/build/libs/*.jar
