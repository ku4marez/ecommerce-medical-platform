name: Build

on:
  push:
    branches: [ main ]

jobs:
  build-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

#      - uses: gradle/actions/setup-gradle@v4

      - name: Set up GitHub Packages credentials
        run: |
          echo "GPR_USER=${{ secrets.GPR_USER  }}" >> $GITHUB_ENV
          echo "GPR_TOKEN=${{ secrets.GPR_TOKEN }}" >> $GITHUB_ENV

      - name: Build everything
        run: ./gradlew --no-daemon --stacktrace clean build -x test
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}

      - name: Login to Docker hub
        run: docker login -u "${{ secrets.DOCKER_USER }}" -p "${{ secrets.DOCKER_PASSWORD }}"

      - name: Build & push catalog-service
        run: |
          SVC="catalog"
          IMAGE="ku4marez/myrepo:${SVC}-${{ github.sha }}"
          docker build -t "$IMAGE" -f ./services/catalog-service/Dockerfile --build-arg GPR_USER=${{ secrets.GPR_USER }} --build-arg GPR_TOKEN=${{ secrets.GPR_TOKEN }} .
          docker push "$IMAGE"
        if: always()

      - name: Build & push order-service
        run: |
          SVC="order"
          IMAGE="ku4marez/myrepo:${SVC}-${{ github.sha }}"
          docker build -t "$IMAGE" -f ./services/order-service/Dockerfile --build-arg GPR_USER=${{ secrets.GPR_USER }} --build-arg GPR_TOKEN=${{ secrets.GPR_TOKEN }} .
          docker push "$IMAGE"
        if: always()

      - name: Build & push gateway-service
        run: |
          SVC="gateway"
          IMAGE="ku4marez/myrepo:${SVC}-${{ github.sha }}"
          docker build -t "$IMAGE" -f ./services/gateway-service/Dockerfile --build-arg GPR_USER=${{ secrets.GPR_USER }} --build-arg GPR_TOKEN=${{ secrets.GPR_TOKEN }} .
          docker push "$IMAGE"
        if: always()

      - name: Build & push inventory-service
        run: |
          SVC="inventory"
          IMAGE="ku4marez/myrepo:${SVC}-${{ github.sha }}"
          docker build -t "$IMAGE" -f ./services/inventory-service/Dockerfile --build-arg GPR_USER=${{ secrets.GPR_USER }} --build-arg GPR_TOKEN=${{ secrets.GPR_TOKEN }} .
          docker push "$IMAGE"
        if: always()

      - name: Build & push payment-service
        run: |
          SVC="payment"
          IMAGE="ku4marez/myrepo:${SVC}-${{ github.sha }}"
          docker build -t "$IMAGE" -f ./services/payment-service/Dockerfile --build-arg GPR_USER=${{ secrets.GPR_USER }} --build-arg GPR_TOKEN=${{ secrets.GPR_TOKEN }} .
          docker push "$IMAGE"
        if: always()

      - name: Save image tags for deploy step
        run: |
          echo "CATALOG_IMAGE=ku4marez/myrepo:catalog-${{ github.sha }}" >> image-tags.txt
          echo "ORDER_IMAGE=ku4marez/myrepo:order-${{ github.sha }}" >> image-tags.txt
          echo "GATEWAY_IMAGE=ku4marez/myrepo:gateway-${{ github.sha }}" >> image-tags.txt
          echo "INVENTORY_IMAGE=ku4marez/myrepo:inventory-${{ github.sha }}" >> image-tags.txt
          echo "PAYMENT_IMAGE=ku4marez/myrepo:payment-${{ github.sha }}" >> image-tags.txt
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: image-tags
          path: image-tags.txt

