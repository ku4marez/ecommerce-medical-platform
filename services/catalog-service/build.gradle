plugins {
	id 'org.springframework.boot'
	id 'io.spring.dependency-management'
	id 'java'
}
dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.springframework.kafka:spring-kafka'

	// Security (resource server style)
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// Caching
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation "com.github.ben-manes.caffeine:caffeine:${rootProject.versions.caffeine}"
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// Resilience / rate limiting
	implementation "io.github.resilience4j:resilience4j-spring-boot3:${rootProject.versions.resilience}"
	implementation "io.github.resilience4j:resilience4j-ratelimiter:${rootProject.versions.resilience}"

	// S3 client (works with MinIO / R2 / S3)
	implementation "software.amazon.awssdk:s3:${rootProject.versions.awsSdk}"

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.kafka:spring-kafka-test'
}
