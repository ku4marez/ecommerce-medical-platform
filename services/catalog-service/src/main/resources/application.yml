ecom:
  resilience:
    enabled: true
    circuit-breaker:
      failure-rate-threshold: 40
      wait-duration-in-open-state-seconds: 15
      sliding-window-size: 50
    retry:
      max-attempts: 4
      wait-duration-ms: 300
    rate-limiter:
      limit-for-period: 20
      limit-refresh-period-seconds: 1
      timeout-duration-seconds: 2
    time-limiter:
      timeout-seconds: 4
  redis:
    enabled: true
    host: redis
    port: 6379
    ttl-seconds: 300
    key-prefix: catalog-service
  security:
    enabled: true
    jwt:
      # Pick ONE (issuer-uri is best in real env; HMAC is fine for dev)
      hmac-secret: ${JWT_SECRET:dev-secret}
      # issuer-uri: ${JWT_ISSUER_URI:}
      # jwk-set-uri: ${JWT_JWKS_URI:}
      roles-claim: roles

  kafka:
    enabled: true
    auto-create-topics: true
    product-topic: catalog.product.v1
    order-topic: orders.order.v1
    payment-topic: payments.payment.v1
    stock-topic: inventory.stock.v1

  # Optional CORS via your web-starter (safe to leave)
  web:
    cors:
      enabled: true
      allowed-origins: [ "http://localhost:3000" ]
      allowed-methods: [ "GET", "POST", "PUT", "DELETE", "OPTIONS" ]
      allowed-headers: [ "*" ]
      allow-credentials: true

  # S3 / MinIO config used by the presign service
  s3:
    bucket: ${S3_BUCKET:local-bucket}
    endpoint: ${S3_ENDPOINT:http://localhost:9000}          # e.g. http://localhost:9000 for MinIO; leave empty for AWS
    region: ${S3_REGION:us-east-1}
    path-style-access: ${S3_PATH_STYLE:true}   # true for MinIO; AWS can be false
    presign-ttl-seconds: 300

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      group-id: catalog-service

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://root:password@mongo-catalog:27017/catalog?authSource=admin}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.springframework.kafka: INFO
    org.springframework.data.mongodb: INFO
    com.github.ku4marez: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes.enabled: true
  metrics:
    tags:
      application: ${spring.application.name:catalog-service}
