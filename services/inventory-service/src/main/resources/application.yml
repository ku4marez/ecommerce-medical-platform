ecom:
  security:
    enabled: true
    jwt:
      hmac-secret: ${JWT_SECRET:dev-secret}
      roles-claim: roles
  kafka:
    enabled: true
    auto-create-topics: true
    product-topic: catalog.product.v1
    order-topic: orders.order.v1
    payment-topic: payments.payment.v1
    stock-topic: inventory.stock.v1
  # Optional CORS via your web-starter (safe to leave)
  web:
    cors:
      enabled: true
      allowed-origins: [ "http://localhost:3000" ]
      allowed-methods: [ "GET", "POST", "PUT", "DELETE", "OPTIONS" ]
      allowed-headers: [ "*" ]
      allow-credentials: true

spring:
  application:
    name: inventory-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      group-id: inventory-service
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://root:password@localhost:27022/inventory?authSource=admin}

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    org.springframework.kafka: INFO
    org.springframework.data.mongodb: INFO
    com.github.ku4marez: DEBUG
