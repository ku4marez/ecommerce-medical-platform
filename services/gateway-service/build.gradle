plugins {
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'java'
}

group = 'com.github.ku4marez'
version = '1.0.0'
java {
    sourceCompatibility = '21'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Optional: reuse your security starter
    implementation project(':starters:ecom-security-starter')
}

tasks.named('test') {
    useJUnitPlatform()
}

configurations.all {
    exclude group: "org.springframework.boot", module: "spring-boot-starter-data-mongodb"
    exclude group: "org.springframework.data", module: "spring-data-mongodb"
}
