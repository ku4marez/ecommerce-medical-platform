server:
  port: 7070

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      default-filters:
        - RemoveRequestHeader=Cookie
      routes:
        - id: catalog
          uri: http://localhost:7071
          predicates:
            - Path=/catalog/**
        - id: inventory
          uri: http://localhost:7072
          predicates:
            - Path=/inventory/**
        - id: orders
          uri: http://localhost:7073
          predicates:
            - Path=/orders/**
        - id: payments
          uri: http://localhost:7074
          predicates:
            - Path=/payments/**
        - id: auth
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

ecom:
  security:
    jwt:
      hmac-secret: ${JWT_SECRET:A1B2C3D4E5F6G7H8I9J0K1L2M3N4O5P6Q7R8S9T0U1V2W3X4}
      roles-claim: roles
      role-prefix: ROLE_
