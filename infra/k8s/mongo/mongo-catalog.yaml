# mongo-catalog.yaml
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-catalog-pvc
spec:
  accessModes: [ "ReadWriteOnce" ]
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-catalog
  template:
    metadata:
      labels:
        app: mongo-catalog
    spec:
      containers:
        - name: mongo
          image: mongo:6.0
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: root
            - name: MONGO_INITDB_ROOT_PASSWORD
              value: password
          volumeMounts:
            - name: data
              mountPath: /data/db
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongo-catalog-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: mongo-catalog
spec:
  selector:
    app: mongo-catalog
  ports:
    - port: 27017
      targetPort: 27017
