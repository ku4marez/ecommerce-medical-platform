apiVersion: apps/v1
kind: Deployment
metadata:
  name: stripe-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stripe-mock
  template:
    metadata:
      labels:
        app: stripe-mock
    spec:
      containers:
        - name: stripe-mock
          image: stripe/stripe-mock:latest
          ports:
            - containerPort: 12111
---
apiVersion: v1
kind: Service
metadata:
  name: stripe-mock
spec:
  selector:
    app: stripe-mock
  ports:
    - port: 12111
      targetPort: 12111
